<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银行内网网络配置生成器</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏦 银行内网网络配置生成器</h1>
            <p class="subtitle">快速生成防火墙/交换机访问控制策略配置</p>
        </header>

        <div class="wizard">
            <!-- Step 1: 基础信息输入 -->
            <div class="step active" id="step1">
                <div class="step-header">
                    <span class="step-number">1</span>
                    <h2>基础信息输入</h2>
                </div>
                <div class="step-content">
                    <div class="form-group">
                        <label for="src_ip">源地址 IP/网段：</label>
                        <input type="text" id="src_ip" placeholder="例如：10.1.1.100 或 192.168.1.0/24" multiple>
                        <small>支持多个 IP，用逗号或换行分隔</small>
                    </div>
                    <div class="form-group">
                        <label for="dst_ip">目的地址 IP/网段：</label>
                        <input type="text" id="dst_ip" placeholder="例如：10.2.2.200 或 172.16.0.0/16" multiple>
                        <small>支持多个 IP，用逗号或换行分隔</small>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="port">端口：</label>
                            <input type="text" id="port" placeholder="例如：80,443 或 8000-9000">
                        </div>
                        <div class="form-group">
                            <label for="protocol">协议：</label>
                            <select id="protocol">
                                <option value="tcp">TCP</option>
                                <option value="udp">UDP</option>
                                <option value="icmp">ICMP</option>
                                <option value="any">任意</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="description">业务描述：</label>
                        <textarea id="description" rows="3" placeholder="请输入业务需求描述..."></textarea>
                    </div>
                    <button class="btn btn-primary" onclick="analyzePath()">下一步：路径分析</button>
                </div>
            </div>

            <!-- Step 2: 路径分析结果 -->
            <div class="step" id="step2">
                <div class="step-header">
                    <span class="step-number">2</span>
                    <h2>路径分析结果</h2>
                </div>
                <div class="step-content">
                    <div class="result-box">
                        <h3>📍 源地址信息</h3>
                        <div id="src_result"></div>
                    </div>
                    <div class="result-box">
                        <h3>📍 目的地址信息</h3>
                        <div id="dst_result"></div>
                    </div>
                    <div class="result-box">
                        <h3>🔍 场景分析</h3>
                        <div id="scene_result"></div>
                    </div>
                    <div class="btn-group">
                        <button class="btn" onclick="backToStep(1)">上一步</button>
                        <button class="btn btn-primary" onclick="showDeviceConfig()">下一步：设备配置</button>
                    </div>
                </div>
            </div>

            <!-- Step 3: 设备配置 -->
            <div class="step" id="step3">
                <div class="step-header">
                    <span class="step-number">3</span>
                    <h2>设备配置选项</h2>
                </div>
                <div class="step-content">
                    <!-- 命名规则输入 -->
                    <div class="naming-section" style="margin-bottom: 25px; padding: 20px; background: #fff3cd; border-radius: 8px; border: 2px solid #ffc107;">
                        <h3 style="margin-top: 0; color: #856404;">📋 策略命名规范</h3>
                        <p style="margin: 10px 0; color: #856404; font-size: 0.9em;">命名格式：<code>acl-{inside/outside}-{YYYYMMDD}-{序号}</code></p>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="rule_date">日期 (YYYYMMDD)：</label>
                                <input type="text" id="rule_date" placeholder="例如：20260807" 
                                       readonly
                                       style="width: 100%; padding: 10px; border: 2px solid #ffc107; border-radius: 4px; font-size: 1em;">
                            </div>
                            <div class="form-group">
                                <label for="rule_seq">序号：</label>
                                <input type="text" id="rule_seq" placeholder="例如：001" value="001" 
                                       style="width: 100%; padding: 10px; border: 2px solid #ffc107; border-radius: 4px; font-size: 1em;">
                            </div>
                        </div>
                        <div id="rule_preview" style="margin-top: 15px; padding: 10px; background: rgba(255,255,255,0.5); border-radius: 4px;">
                            <strong>预览：</strong> <span id="rule_preview_text">acl-inside-YYYYMMDD-001 / acl-outside-YYYYMMDD-001</span>
                        </div>
                    </div>
                    
                    <div id="devices_list"></div>
                    <div class="btn-group">
                        <button class="btn" onclick="backToStep(2)">上一步</button>
                        <button class="btn btn-primary" onclick="generateConfig()">生成配置</button>
                    </div>
                </div>
            </div>

            <!-- Step 4: 配置结果 -->
            <div class="step" id="step4">
                <div class="step-header">
                    <span class="step-number">4</span>
                    <h2>配置结果</h2>
                </div>
                <div class="step-content">
                    <div id="config_results"></div>
                    <div class="btn-group">
                        <button class="btn" onclick="backToStep(3)">返回修改</button>
                        <button class="btn btn-success" onclick="window.print()">打印配置</button>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>银行内网网络配置生成器 v1.0 | © 2026</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
